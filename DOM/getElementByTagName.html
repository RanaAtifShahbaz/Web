<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Element By Tag Name</title>
</head>

<body>
    <p>Welcome</p>
    <p>Rana</p>
    <p>Atif</p>
</body>
<script>

    let pAllTag = document.getElementsByTagName("p")
    console.log(pAllTag[1].innerHTML)
</script>

</html>
