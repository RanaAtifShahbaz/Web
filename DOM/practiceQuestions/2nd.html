<body>
    <!-- Change Color

Create three buttons:

Red
Green
Blue

Each changes the background color of a div. -->
<div class="red">
<button>Red</button>
</div>
<div class="green">
<button>Green</button>
</div>
<div class="blue">
<button>Blue</button>
</div>


</body>
<script>
// let Changer=document.querySelector(".red")
let btnr=document.querySelector(".red")
let btng=document.querySelector(".green")
let btnb=document.querySelector(".blue")
btnr.addEventListener("click",()=>{
  btnr.style.backgroundColor="red"


})
btng.addEventListener("click",()=>{
  btng.style.backgroundColor="green"


})
btnb.addEventListener("click",()=>{
  btnb.style.backgroundColor="blue"


})
</script>
